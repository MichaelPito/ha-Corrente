blueprint:
  name: Corrente — start an appliance at the cheapest time
  description: >-
    When the appliance is ready (you loaded the dishwasher or the washing machine and
    turned on the "ready" helper), wait for Corrente's best time to start, switch the
    appliance on and reset the helper. Optionally send a notification.

    Italiano: quando l'apparecchio è pronto (hai acceso l'aiutante "pronto"), aspetta il
    momento migliore indicato da Corrente, accende l'apparecchio e spegne l'aiutante.
  domain: automation
  source_url: https://github.com/MichaelPito/ha-corrente/blob/main/blueprints/automation/corrente/start_at_best_time.yaml
  author: Corrente
  input:
    best_start:
      name: Corrente "best time to start" sensor
      selector:
        entity:
          filter:
            - integration: corrente
              domain: sensor
              device_class: timestamp
    ready:
      name: '"Ready" helper (input_boolean)'
      description: Turn it on when the appliance is loaded and can start.
      selector:
        entity:
          filter:
            - domain: input_boolean
    appliance:
      name: Appliance switch
      description: The switch (or smart plug) that starts the appliance.
      selector:
        entity:
          filter:
            - domain: switch
    notify_device:
      name: Notify this device (optional)
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app

mode: single

triggers:
  - trigger: time
    at: !input best_start

conditions:
  - condition: state
    entity_id: !input ready
    state: "on"

actions:
  - action: switch.turn_on
    target:
      entity_id: !input appliance
  - action: input_boolean.turn_off
    target:
      entity_id: !input ready
  - variables:
      notify_device: !input notify_device
  - if:
      - condition: template
        value_template: "{{ notify_device != '' }}"
    then:
      - domain: mobile_app
        type: notify
        device_id: !input notify_device
        message: "Corrente: started at the cheapest time ⚡"
