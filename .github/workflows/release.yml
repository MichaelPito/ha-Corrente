name: Release

# Publishes the GitHub release for the version in manifest.json, with the notes
# of that version from CHANGELOG.md and a zip of the integration for manual
# installs. Two ways to start it:
# - push a tag "vX.Y.Z";
# - Actions → Release → Run workflow (on main): the tag is created from the
#   manifest version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the manifest (and the tag, if any)
        run: |
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/corrente/manifest.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
              echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Run the release from main, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"
          echo "TAG=v$manifest" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|^\[{re.escape(version)}\]:|\Z)", text, re.M | re.S)
          if not match:
              raise SystemExit(f"No section for {version} in CHANGELOG.md")
          heading = text[match.start():text.index("\n", match.start())]
          if "not released" in heading:
              raise SystemExit(f"Put the release date in CHANGELOG.md first: {heading}")
          open("notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          PY
      - name: Zip the integration
        run: cd custom_components/corrente && zip -r -q "$GITHUB_WORKSPACE/corrente.zip" . -x "__pycache__/*" "*/__pycache__/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" corrente.zip --title "Corrente $VERSION" --notes-file notes.md --verify-tag
          else
            gh release create "$TAG" corrente.zip --title "Corrente $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
