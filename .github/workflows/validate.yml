name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS reads the repository from outside without credentials, so it can only
    # validate a public repository. Skipped while the repo is private (until launch).
    if: ${{ github.event.repository && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Description and topics are set by the owner at the public launch; then this line
          # goes: the catalog accepts only a run without "ignore" (brand: custom_components/corrente/brand).
          ignore: description topics
