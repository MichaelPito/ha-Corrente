name: Tests

on:
  # 💰 [2026-11-11] Solo a mano (scheda Actions → Run workflow) o prima di un rilascio.
  # 👤 Owner: «riduciamo al minimo corrente» — il conto GitHub Actions dell'account sfora la quota gratuita.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  card:
    name: Card syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --check custom_components/corrente/frontend/corrente-card.js

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Home Assistant 2026.11 (pytest-homeassistant) needs Python 3.14.2 or later.
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -q

  pytest-min:
    name: Pytest (oldest supported Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test_min.txt
      - name: Run tests
        run: python -m pytest -q
